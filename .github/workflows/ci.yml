name: CI

on:
  pull_request:
    branches: [dev, staging, prod]
  push:
    branches: [dev, staging, prod]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        # Non-blocking for now: report issues without failing the build.
        # Remove `continue-on-error` once the codebase is clean.
        continue-on-error: true
        run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.1-alpine3.19
        env:
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: db
      POSTGRES_PASSWORD: db
      POSTGRES_DB: db
      MLFLOW_TRACKING_URI: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        working-directory: backend_sql
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Run tests
        working-directory: backend_sql
        run: pytest pytests/ -v --cov=. --cov-report=term-missing

  docker-build:
    name: Validate Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: docker compose config -q
      - name: Build backend image (smoke build)
        uses: docker/build-push-action@v6
        with:
          context: ./backend_sql
          push: false
          tags: backend_sql:ci
