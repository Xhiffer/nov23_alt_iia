version: "3.9"

networks:
  dbnet:

volumes:
  postgres-db-volume:       # Airflow DB
  minio-data:               # Minio storage
  backend-postgres-data:    # App DB
  prometheus-data:          # Prometheus TSDB
  grafana-data:             # Grafana state

# Secrets are read from a gitignored `.env` (see `.env.example`). Nothing is
# hardcoded here anymore.

services:
  # ---------------------
  # Main App Database
  # ---------------------
  db:
    image: postgres:16.1-alpine3.19
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./backend_sql/postgres-data:/var/lib/postgresql/data
    networks:
      - dbnet
    restart: always

  # ---------------------
  # Main Backend
  # ---------------------
  app:
    build:
      context: ./backend_sql
    container_name: backend_sql
    volumes:
      - ./backend_sql:/app
    ports:
      - "8000:8000"
    networks:
      - dbnet
    depends_on:
      - db
      - mlflow
      - minio
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      # Provenance : injecté pour le lineage des runs MLflow (SHA du code). Vide -> "unknown".
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    command: ["/app/wait-for-db.sh", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always


  # ---------------------
  # PgAdmin for Main DB
  # ---------------------
  phppgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8084:80"
    depends_on:
      - db
    networks:
      - dbnet
    restart: always

  # ---------------------
  # AI Models
  # ---------------------
  ai_model_gravity_classification:
    build:
      context: ./models/gravity_classification
    container_name: ai_model_gravity_classification
    volumes:
      - ./models/gravity_classification:/app
    ports:
      - "81:81"
    networks:
      - dbnet
    depends_on:
      - db
      - mlflow
      - minio
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    restart: always


  ai_model_accident_detection:
    build:
      context: ./models/accident_detection
    container_name: ai_model_accident_detection
    volumes:
      - ./models/accident_detection:/app
    ports:
      - "83:83"
    networks:
      - dbnet
    depends_on:
      - db
    restart: always

  ai_model_accident_labelisation:
    build:
      context: ./models/accident_data_labelisation
    container_name: ai_model_accident_labelisation
    volumes:
      - ./models/accident_data_labelisation:/app
    ports:
      - "82:82"
    networks:
      - dbnet
    depends_on:
      - db
    restart: always

  # ---------------------
  # Frontend
  # ---------------------
  frontend:
    build:
      context: ./front
    container_name: frontend
    volumes:
      - ./front:/app
    ports:
      - "5010:5010"
    networks:
      - dbnet
    restart: always

  # ---------------------
  # MinIO
  # ---------------------
  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dbnet
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------
  # Create Bucket for MLflow
  # ---------------------
  create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p myminio/mlflow || true
      "
    networks:
      - dbnet

  # ---------------------
  # MLflow
  # ---------------------
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    depends_on:
      - db
      - minio
      - create-bucket
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
      --allowed-hosts '*'
    networks:
      - dbnet
    restart: always




  # ---------------------
  # Airflow DB (Separate from Main DB)
  # ---------------------
  postgres:
    image: postgres:13
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}"]
      interval: 5s
      retries: 5
    networks:
      - dbnet
    restart: always

  # ---------------------
  # Redis for Airflow
  # ---------------------
  redis:
    image: redis:latest
    container_name: airflow_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50
    networks:
      - dbnet
    restart: always

  # ---------------------
  # Airflow Common Settings
  # ---------------------
  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY}"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "${AIRFLOW__CORE__LOAD_EXAMPLES}"
      AIRFLOW__API__AUTH_BACKEND: "airflow.api.auth.backend.basic_auth"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      - postgres
      - redis
    networks:
      - dbnet
    restart: always

  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: airflow_scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      - postgres
      - redis
    networks:
      - dbnet
    restart: always

  airflow-worker:
    image: apache/airflow:2.9.1
    container_name: airflow_worker
    command: celery worker
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      - postgres
      - redis
    networks:
      - dbnet
    restart: always

  airflow-init:
    image: apache/airflow:2.9.1
    container_name: airflow_init
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY}"
    entrypoint: >
      bash -c "
      airflow db upgrade &&
      airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Air --lastname Flow --role Admin --email ${PGADMIN_DEFAULT_EMAIL} || true
      "
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      - postgres
    networks:
      - dbnet
    restart: on-failure

  api_gateway:
    build:
      context: ./api_gateway
    container_name: api_gateway
    volumes:
      - ./api_gateway:/app
    ports:
      - "7000:7000"
    networks:
      - dbnet
    depends_on:
      - app
      - ai_model_gravity_classification
      - ai_model_accident_labelisation
      - ai_model_accident_detection
    restart: always

  # ---------------------
  # Monitoring — Prometheus
  # ---------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - dbnet
    depends_on:
      - ai_model_gravity_classification
    restart: always

  # ---------------------
  # Monitoring — Grafana
  # ---------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - dbnet
    depends_on:
      - prometheus
    restart: always

## docker compose up airflow-init
## docker compose up
